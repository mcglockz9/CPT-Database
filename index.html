<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPT Database — Orthopaedic Sports Medicine</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "DM Sans", sans-serif; background: #0f1117; color: #e8eaf0; font-size: 14px; -webkit-font-smoothing: antialiased; }

/* TAB BAR */
#tabBar { display:flex; background:#181c27; border-bottom:1px solid #2a2f42; padding:0 16px; gap:4px; }
.tab { background:none; border:none; border-bottom:2px solid transparent; color:#8b91a8; font-family:"DM Sans",sans-serif; font-size:13px; font-weight:500; padding:10px 14px 8px; cursor:pointer; transition:color 0.15s,border-color 0.15s; }
.tab:hover { color:#e8eaf0; }
.tab.active { color:#4f8ef7; border-bottom-color:#4f8ef7; }

/* TOP CONTROLS */
#topbar { background:#181c27; border-bottom:1px solid #2a2f42; padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; position:sticky; top:0; z-index:50; }
.logo { font-family:"DM Mono",monospace; font-size:12px; color:#4f8ef7; white-space:nowrap; flex-shrink:0; }
.logo span { color:#555d7a; }
#search { flex:1; min-width:160px; background:#0f1117; border:1px solid #2a2f42; border-radius:6px; color:#e8eaf0; font-family:"DM Sans",sans-serif; font-size:13px; padding:7px 12px; outline:none; }
#search::placeholder { color:#555d7a; }
#search:focus { border-color:#4f8ef7; }
#catFilter { background:#0f1117; border:1px solid #2a2f42; border-radius:6px; color:#e8eaf0; font-family:"DM Sans",sans-serif; font-size:13px; padding:7px 10px; outline:none; cursor:pointer; }
#favBtn { background:#1e2333; border:1px solid #2a2f42; border-radius:6px; color:#e8eaf0; font-family:"DM Sans",sans-serif; font-size:13px; padding:7px 12px; cursor:pointer; white-space:nowrap; }
#favBtn.active { background:rgba(240,168,50,0.12); border-color:#c88a20; color:#f0a832; }

/* STATS */
#statsBar { padding:8px 16px; display:flex; gap:6px; flex-wrap:wrap; background:#181c27; border-bottom:1px solid #2a2f42; }
.pill { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:500; border:1px solid #2a2f42; color:#8b91a8; background:#0f1117; cursor:pointer; }
.pill strong { font-weight:600; }

/* DATABASE ROWS */
#listWrap { padding:0 0 60px 0; }
.row-header { display:grid; grid-template-columns:36px 90px 150px 1fr; padding:8px 16px; background:#0f1117; border-bottom:1px solid #2a2f42; position:sticky; top:0; z-index:40; }
.row-header span { font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#555d7a; }
.row { display:grid; grid-template-columns:36px 90px 150px 1fr; border-bottom:1px solid #1e2333; align-items:start; }
.row:hover { background:#181c27; }
.cell { padding:9px 10px; }
.cell-fav { padding:9px 4px; display:flex; align-items:flex-start; justify-content:center; }
.cell-code { font-family:"DM Mono",monospace; font-size:13px; font-weight:500; color:#e8eaf0; white-space:nowrap; }
.cat-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:500; white-space:nowrap; }
.cell-desc { font-size:13px; color:#8b91a8; line-height:1.5; word-break:break-word; }
.note-tag { display:inline-flex; align-items:center; gap:4px; margin-top:5px; padding:2px 8px; border-radius:4px; font-size:11px; background:rgba(79,142,247,0.12); color:#7aabff; border:1px solid rgba(79,142,247,0.25); }
.fav-btn { background:none; border:none; cursor:pointer; color:#555d7a; font-size:16px; line-height:1; padding:2px; transition:color 0.15s; }
.fav-btn:hover { color:#f0a832; }
.fav-btn.active { color:#f0a832; }
#empty { display:none; text-align:center; padding:60px 20px; color:#555d7a; }
#countRow { position:fixed; bottom:0; left:0; right:0; padding:8px 16px; font-size:11px; color:#555d7a; background:#0f1117; border-top:1px solid #2a2f42; }

/* GUIDE */
#panel-guide { display:none; padding:0 0 80px 0; }
#guideContent { max-width:860px; padding:16px 16px 40px; }
.gs { margin-bottom:16px; background:#181c27; border:1px solid #2a2f42; border-radius:10px; overflow:hidden; }
.gs-head { display:flex; align-items:center; gap:10px; padding:12px 16px; background:#1e2333; border-bottom:1px solid #2a2f42; cursor:pointer; user-select:none; }
.gs-head:hover { background:#252c40; }
.gs-title { font-size:14px; font-weight:600; color:#e8eaf0; flex:1; }
.gs-sub { font-size:11px; color:#8b91a8; font-weight:400; margin-top:2px; }
.gs-chev { color:#555d7a; font-size:11px; transition:transform 0.2s; flex-shrink:0; }
.gs.open .gs-chev { transform:rotate(180deg); }
.gs-body { display:none; }
.gs.open .gs-body { display:block; }
.gc-row { display:grid; grid-template-columns:82px 1fr; gap:8px 12px; padding:12px 16px; border-bottom:1px solid #1a1f2e; align-items:start; }
.gc-row:last-child { border-bottom:none; }
.gc-code { font-family:"DM Mono",monospace; font-size:14px; font-weight:500; color:#e8eaf0; padding-top:2px; }
.gc-name { font-size:12px; font-weight:600; color:#e8eaf0; margin-bottom:5px; }
.gc-rule { font-size:12px; color:#8b91a8; line-height:1.6; }
.gc-rule ul { margin:5px 0 0 16px; }
.gc-rule li { margin-bottom:3px; }
.callout { display:flex; align-items:flex-start; gap:6px; margin-top:7px; padding:6px 10px; border-radius:6px; font-size:11px; line-height:1.45; }
.callout.info { background:rgba(79,142,247,0.1); color:#7aabff; border:1px solid rgba(79,142,247,0.2); }
.callout.warn { background:rgba(240,168,50,0.1); color:#f0c050; border:1px solid rgba(240,168,50,0.25); }
.callout.good { background:rgba(62,207,142,0.1); color:#3ecf8e; border:1px solid rgba(62,207,142,0.25); }

/* OPTIMIZE */
#panel-opt { display:none; padding:0 0 80px 0; }
#optContent { max-width:900px; padding:16px 16px 40px; }
.opt-section { margin-bottom:16px; background:#181c27; border:1px solid #2a2f42; border-radius:10px; overflow:hidden; }
.opt-head { display:flex; align-items:center; gap:10px; padding:12px 16px; background:#1e2333; border-bottom:1px solid #2a2f42; cursor:pointer; user-select:none; }
.opt-head:hover { background:#252c40; }
.opt-head-left { flex:1; }
.opt-title { font-size:14px; font-weight:600; color:#e8eaf0; }
.opt-sub { font-size:11px; color:#8b91a8; margin-top:2px; }
.opt-rvu { font-family:"DM Mono",monospace; font-size:12px; color:#3ecf8e; font-weight:500; white-space:nowrap; }
.opt-chev { color:#555d7a; font-size:11px; transition:transform 0.2s; flex-shrink:0; }
.opt-section.open .opt-chev { transform:rotate(180deg); }
.opt-body { display:none; padding:14px 16px; }
.opt-section.open .opt-body { display:block; }

.stack { background:#0f1117; border:1px solid #2a2f42; border-radius:8px; padding:12px 14px; margin-bottom:12px; }
.stack:last-child { margin-bottom:0; }
.stack-title { font-size:12px; font-weight:600; color:#e8eaf0; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.stack-title .badge-green { background:rgba(62,207,142,0.15); color:#3ecf8e; border:1px solid rgba(62,207,142,0.3); padding:1px 7px; border-radius:4px; font-size:10px; font-weight:600; }
.stack-title .badge-gold { background:rgba(240,168,50,0.15); color:#f0a832; border:1px solid rgba(240,168,50,0.3); padding:1px 7px; border-radius:4px; font-size:10px; font-weight:600; }
.code-stack { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.cs-item { display:flex; align-items:center; gap:6px; background:#181c27; border:1px solid #2a2f42; border-radius:5px; padding:4px 10px; }
.cs-code { font-family:"DM Mono",monospace; font-size:12px; color:#4f8ef7; font-weight:500; }
.cs-mod { font-family:"DM Mono",monospace; font-size:10px; color:#f0a832; }
.cs-desc { font-size:11px; color:#8b91a8; }
.cs-plus { color:#555d7a; font-size:14px; font-weight:300; }
.stack-rule { font-size:12px; color:#8b91a8; line-height:1.55; margin-bottom:6px; }
.stack-doc { font-size:11px; color:#555d7a; margin-top:6px; }
.stack-doc strong { color:#8b91a8; }

@media (max-width:580px) {
  .row,.row-header { grid-template-columns:32px 68px 100px 1fr; }
  .cell { padding:8px 6px; }
  .cat-badge { font-size:10px; padding:2px 5px; }
  .gc-row { grid-template-columns:70px 1fr; }
}
@media (max-width:420px) {
  .row,.row-header { grid-template-columns:30px 65px 1fr; }
  .cell-cat,.row-header .hdr-cat { display:none; }
}
</style>
</head>

let guideBuilt = false;

// ---- TAB SWITCHING ----
var optBuilt = false;
function switchTab(tab) {
  document.getElementById('panel-db').style.display    = tab === 'db'    ? 'block' : 'none';
  document.getElementById('panel-guide').style.display = tab === 'guide' ? 'block' : 'none';
  document.getElementById('panel-opt').style.display   = tab === 'opt'   ? 'block' : 'none';
  document.getElementById('tab-db').classList.toggle('active', tab === 'db');
  document.getElementById('tab-guide').classList.toggle('active', tab === 'guide');
  document.getElementById('tab-opt').classList.toggle('active', tab === 'opt');
  if (tab === 'guide' && !guideBuilt) { buildGuide(); guideBuilt = true; }
  if (tab === 'opt' && !optBuilt) { buildOpt(); optBuilt = true; }
}

// ---- DATABASE ----
function saveFavs() { localStorage.setItem('cpt_favs', JSON.stringify([...favs])); }

function toggleFavMode() {
  showFavOnly = !showFavOnly;
  const btn = document.getElementById('favBtn');
  btn.textContent = showFavOnly ? '★ All codes' : '☆ My codes';
  btn.classList.toggle('active', showFavOnly);
  render();
}

function toggleCode(code) {
  if (favs.has(code)) favs.delete(code); else favs.add(code);
  saveFavs();
  document.querySelectorAll('[data-code="'+code+'"]').forEach(btn => {
    btn.classList.toggle('active', favs.has(code));
    btn.textContent = favs.has(code) ? '★' : '☆';
  });
  updateStats();
}

function filter() { render(); }

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const cat = document.getElementById('catFilter').value;
  let rows = ALL;
  if (showFavOnly) rows = rows.filter(r => favs.has(r[0]));
  if (cat) rows = rows.filter(r => r[1] === cat);
  if (q) rows = rows.filter(r =>
    r[0].includes(q) || r[2].toLowerCase().includes(q) ||
    r[1].toLowerCase().includes(q) ||
    (r[3] && r[3].toLowerCase().includes(q)) ||
    (r[4] && r[4].toLowerCase().includes(q))
  );
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('countRow').textContent = 'Showing ' + rows.length + ' of ' + ALL.length + ' codes';
  const container = document.getElementById('rows');
  container.innerHTML = rows.map(function(r) {
    var code=r[0], cat=r[1], desc=r[2], note=r[3];
    var c = CAT_COLORS[cat] || {bg:'#222',color:'#aaa'};
    return '<div class="row">'
      + '<div class="cell-fav"><button class="fav-btn' + (favs.has(code)?' active':'') + '" data-code="' + code + '" onclick="toggleCode(\'' + code + '\')">' + (favs.has(code)?'★':'☆') + '</button></div>'
      + '<div class="cell cell-code">' + code + '</div>'
      + '<div class="cell cell-cat"><span class="cat-badge" style="background:' + c.bg + ';color:' + c.color + ';">' + cat + '</span></div>'
      + '<div class="cell cell-desc">' + desc + (note ? '<br><span class="note-tag">ℹ ' + note + '</span>' : '') + '</div>'
      + '</div>';
  }).join('');
}

function updateStats() {
  var counts = {};
  ALL.forEach(function(r){ counts[r[1]] = (counts[r[1]]||0)+1; });
  var bar = document.getElementById('statsBar');
  bar.innerHTML = '<span class="pill">★ ' + favs.size + ' saved</span>'
    + Object.entries(counts).map(function(e){
        var col = CAT_COLORS[e[0]]||{bg:'#222',color:'#aaa'};
        return '<span class="pill" style="background:'+col.bg+';color:'+col.color+';border-color:'+col.color+'44;" onclick="document.getElementById(\'catFilter\').value=\''+e[0]+'\';filter();">'+e[0]+' <strong>'+e[1]+'</strong></span>';
      }).join('');
}

function buildOpt() {
  var el = document.getElementById('optContent');
  el.innerHTML = OPT.map(function(s, si) {
    return '<div class="opt-section" id="os-'+si+'">'
      + '<div class="opt-head" onclick="toggleOs('+si+')">'
      + '<div class="opt-head-left"><div class="opt-title">'+s.title+'</div><div class="opt-sub">'+s.sub+'</div></div>'
      + '<span class="opt-chev">▼</span>'
      + '</div>'
      + '<div class="opt-body">'
      + s.combos.map(function(c) {
          var badgeClass = c.badge === 'gold' ? 'badge-gold' : 'badge-green';
          var badgeLabel = c.badge === 'gold' ? '★ High Value' : '✓ Common Add-on';
          return '<div class="stack">'
            + '<div class="stack-title"><span>'+c.label+'</span><span class="'+badgeClass+'">'+badgeLabel+'</span></div>'
            + (c.codes.length ? '<div class="code-stack">'
              + c.codes.map(function(item) {
                  if (item.code === '+') return '<span class="cs-plus">+</span>';
                  return '<div class="cs-item"><span class="cs-code">'+item.code+'</span>'
                    + (item.mod ? '<span class="cs-mod">'+item.mod+'</span>' : '')
                    + '<span class="cs-desc">'+item.desc+'</span></div>';
                }).join('') + '</div>' : '')
            + '<div class="stack-rule">'+c.rule+'</div>'
            + (c.doc ? '<div class="stack-doc"><strong>📝 Document:</strong> '+c.doc+'</div>' : '')
            + '</div>';
        }).join('')
      + '</div></div>';
  }).join('');
  toggleOs(0);
}

function toggleOs(i) {
  var el = document.getElementById('os-'+i);
  if (el) el.classList.toggle('open');
}
