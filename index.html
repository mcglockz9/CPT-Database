<html lang="en">
<head>

<title>CPT Code Database — Orthopaedic Sports Medicine</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #0f1117;
  color: #e8eaf0;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* HEADER */
#topbar {
  background: #181c27;
  border-bottom: 1px solid #2a2f42;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 50;
}
.logo {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: #4f8ef7;
  white-space: nowrap;
  flex-shrink: 0;
}
.logo span { color: #555d7a; }
#search {
  flex: 1;
  min-width: 160px;
  background: #0f1117;
  border: 1px solid #2a2f42;
  border-radius: 6px;
  color: #e8eaf0;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 7px 12px;
  outline: none;
}
#search::placeholder { color: #555d7a; }
#search:focus { border-color: #4f8ef7; }
#catFilter {
  background: #0f1117;
  border: 1px solid #2a2f42;
  border-radius: 6px;
  color: #e8eaf0;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 7px 10px;
  outline: none;
  cursor: pointer;
}
#favBtn {
  background: #1e2333;
  border: 1px solid #2a2f42;
  border-radius: 6px;
  color: #e8eaf0;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 7px 12px;
  cursor: pointer;
  white-space: nowrap;
}
#favBtn.active { background: rgba(240,168,50,0.12); border-color: #c88a20; color: #f0a832; }

/* STATS */
#statsBar {
  padding: 8px 16px;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  background: #181c27;
  border-bottom: 1px solid #2a2f42;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid #2a2f42;
  color: #8b91a8;
  background: #0f1117;
  cursor: pointer;
}
.pill strong { font-weight: 600; }

/* ROW LAYOUT — use divs not table */
#listWrap {
  padding: 0 0 60px 0;
}

.row-header {
  display: grid;
  grid-template-columns: 36px 90px 150px 1fr;
  gap: 0;
  padding: 8px 16px;
  background: #0f1117;
  border-bottom: 1px solid #2a2f42;
  position: sticky;
  top: 57px;
  z-index: 40;
}
.row-header span {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #555d7a;
}

.row {
  display: grid;
  grid-template-columns: 36px 90px 150px 1fr;
  gap: 0;
  padding: 0;
  border-bottom: 1px solid #1e2333;
  align-items: start;
}
.row:hover { background: #181c27; }

.cell {
  padding: 9px 10px;
  align-self: start;
}
.cell-fav {
  padding: 6px 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 9px;
}
.cell-code {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: #e8eaf0;
  white-space: nowrap;
}
.cell-cat { }
.cat-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.cell-desc {
  font-size: 13px;
  color: #8b91a8;
  line-height: 1.5;
  word-break: break-word;
}
.note-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 5px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  background: rgba(79,142,247,0.12);
  color: #7aabff;
  border: 1px solid rgba(79,142,247,0.25);
}

.fav-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #555d7a;
  font-size: 16px;
  line-height: 1;
  padding: 2px;
  transition: color 0.15s;
}
.fav-btn:hover { color: #f0a832; }
.fav-btn.active { color: #f0a832; }

#empty {
  display: none;
  text-align: center;
  padding: 60px 20px;
  color: #555d7a;
  font-size: 14px;
}

#countRow {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 8px 16px;
  font-size: 11px;
  color: #555d7a;
  background: #0f1117;
  border-top: 1px solid #2a2f42;
}

@media (max-width: 580px) {
  .row, .row-header {
    grid-template-columns: 32px 72px 100px 1fr;
  }
  .cell { padding: 8px 6px; }
  .cat-badge { font-size: 10px; padding: 2px 5px; }
  .cell-code { font-size: 12px; }
  .cell-desc { font-size: 12px; }
}
@media (max-width: 420px) {
  .row, .row-header {
    grid-template-columns: 30px 68px 1fr;
  }
  .cell-cat { display: none; }
  .row-header .hdr-cat { display: none; }
}
</style>

let favs = new Set(JSON.parse(localStorage.getItem('cpt_favs')||'[]'));
let showFavOnly = false;

function saveFavs() { localStorage.setItem('cpt_favs', JSON.stringify([...favs])); }

function toggleFavMode() {
  showFavOnly = !showFavOnly;
  const btn = document.getElementById('favBtn');
  btn.textContent = showFavOnly ? '★ All codes' : '☆ My codes';
  btn.classList.toggle('active', showFavOnly);
  render();
}

function toggleCode(code) {
  if (favs.has(code)) favs.delete(code); else favs.add(code);
  saveFavs();
  document.querySelectorAll(`[data-code="${code}"]`).forEach(btn => {
    btn.classList.toggle('active', favs.has(code));
    btn.textContent = favs.has(code) ? '★' : '☆';
  });
  updateStats();
}

function filter() { render(); }

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const cat = document.getElementById('catFilter').value;
  let rows = ALL;
  if (showFavOnly) rows = rows.filter(r => favs.has(r[0]));
  if (cat) rows = rows.filter(r => r[1] === cat);
  if (q) rows = rows.filter(r =>
    r[0].includes(q) || r[2].toLowerCase().includes(q) ||
    r[1].toLowerCase().includes(q) ||
    (r[3] && r[3].toLowerCase().includes(q)) ||
    (r[4] && r[4].toLowerCase().includes(q))
  );
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('countRow').textContent = `Showing ${rows.length} of ${ALL.length} codes`;
  const container = document.getElementById('rows');
  container.innerHTML = rows.map(([code, cat, desc, note]) => {
    const c = CAT_COLORS[cat] || {bg:'#222',color:'#aaa'};
    return `<div class="row">
      <div class="cell-fav"><button class="fav-btn${favs.has(code)?' active':''}" data-code="${code}" onclick="toggleCode('${code}')">${favs.has(code)?'★':'☆'}</button></div>
      <div class="cell cell-code">${code}</div>
      <div class="cell cell-cat"><span class="cat-badge" style="background:${c.bg};color:${c.color};">${cat}</span></div>
      <div class="cell cell-desc">${desc}${note?`<br><span class="note-tag">ℹ ${note}</span>`:''}</div>
    </div>`;
  }).join('');
}

function updateStats() {
  const counts = {};
  ALL.forEach(([,cat]) => counts[cat] = (counts[cat]||0)+1);
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `<span class="pill">★ ${favs.size} saved</span>`
    + Object.entries(counts).map(([c,n]) => {
        const col = CAT_COLORS[c]||{bg:'#222',color:'#aaa'};
        return `<span class="pill" style="background:${col.bg};color:${col.color};border-color:${col.color}44;" onclick="document.getElementById('catFilter').value='${c}';filter();">${c} <strong>${n}</strong></span>`;
      }).join('');
}

render();
updateStats();
</script>
